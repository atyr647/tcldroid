plugins {
    id 'com.android.application'
}

// Inputs supplied by tools/build-android-host.sh (see there for the layout):
//   -Ptcldroid.ndk=<NDK dir>          pinned NDK (upstream/versions.env)
//   -Ptcldroid.ndkVersion=<revision>  its Pkg.Revision; AGP verifies it against ndk dir
//   -Ptcldroid.jniLibs=<dir>          <abi>/libtcl9.0.so staged from the Tcl build
//   -Ptcldroid.tclRoot=<dir>          build/install (android-<abi>/{include,lib})
//   -Ptcldroid.tkRoot=<dir>           build/ (tk-<abi>/libtk9.0.so from tools/build-tk.sh)
//   -Ptcldroid.tkAndroid=<dir>        tk-android/android (public header tkAndroid.h)
//   -Ptcldroid.appAssets=<dir>        contains app/ : the Tcl/Tk app's files (main.tcl, ...)
//   -Ptcldroid.appRes=<dir>           contains drawable/app_icon.png
//   -Ptcldroid.appId / appName / appVersion / appCode   the app's identity
//   -Ptcldroid.splash=#RRGGBB          launch screen colour (the app icon is centred on it)
//   -Ptcldroid.keystore=<file>        optional signing key (else the Android debug key);
//                                     passwords/alias come from the environment so they never
//                                     appear on a command line: TCLDROID_KS_PASS,
//                                     TCLDROID_KEY_ALIAS, TCLDROID_KEY_PASS (default: store pass)
def pinnedNdkDir = providers.gradleProperty('tcldroid.ndk').get()
def pinnedNdkRev = providers.gradleProperty('tcldroid.ndkVersion').get()
def jniLibsDir   = providers.gradleProperty('tcldroid.jniLibs').get()
def tclRoot      = providers.gradleProperty('tcldroid.tclRoot').get()
def tkRoot       = providers.gradleProperty('tcldroid.tkRoot').get()
def tkAndroidDir = providers.gradleProperty('tcldroid.tkAndroid').get()
def appAssets    = providers.gradleProperty('tcldroid.appAssets').get()
def appRes       = providers.gradleProperty('tcldroid.appRes').get()
def appId        = providers.gradleProperty('tcldroid.appId').get()
def appName      = providers.gradleProperty('tcldroid.appName').get()
def appVersion   = providers.gradleProperty('tcldroid.appVersion').get()
def appKeystore  = providers.gradleProperty('tcldroid.keystore').orNull
def appSplash    = providers.gradleProperty('tcldroid.splash').orElse('#FFFFFF').get()
def appCode      = providers.gradleProperty('tcldroid.appCode').get().toInteger()
// A string resource: escape what aapt2 treats specially.
def appNameXml   = appName.replace('&', '&amp;').replace('<', '&lt;').replace("'", "\\'").replace('"', '\\"')

android {
    namespace 'dev.tcldroid.host'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion = pinnedNdkRev
    ndkPath = pinnedNdkDir

    defaultConfig {
        applicationId appId
        minSdk 26
        targetSdk 35
        versionCode appCode
        versionName appVersion
        resValue 'string', 'app_name', appNameXml
        resValue 'color', 'tcldroid_splash', appSplash
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments "-DTCL_INSTALL_ROOT=${tclRoot}", "-DTK_BUILD_ROOT=${tkRoot}", "-DTK_ANDROID_DIR=${tkAndroidDir}" }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    sourceSets.main.jniLibs.srcDirs = [jniLibsDir]
    sourceSets.main.assets.srcDirs = ['src/main/assets', appAssets]
    sourceSets.main.res.srcDirs = ['src/main/res', appRes]

    packaging {
        jniLibs {
            // libtcl9.0.so and libtk9.0.so carry their script libraries as zips appended to the
            // ELF file, and Tcl mounts it by opening the library's own path
            // (found with dladdr). That needs (a) the library extracted to disk
            // and (b) no stripping, which would discard the appended zip.
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libtcl9.0.so', '**/libtk9.0.so']
        }
    }

    lint {
        // The release "lint vital" pass downloads its own tooling; a Tcl app's Java is a few
        // hundred lines we test directly, so skip it (keeps release builds working offline).
        checkReleaseBuilds false
    }

    signingConfigs {
        if (appKeystore != null) {
            appKey {
                storeFile file(appKeystore)
                storePassword System.getenv('TCLDROID_KS_PASS')
                keyAlias System.getenv('TCLDROID_KEY_ALIAS')
                keyPassword System.getenv('TCLDROID_KEY_PASS') ?: System.getenv('TCLDROID_KS_PASS')
            }
        }
    }

    buildTypes {
        debug {
            if (appKeystore != null) { signingConfig signingConfigs.appKey }
        }
        release {
            minifyEnabled false
            if (appKeystore != null) { signingConfig signingConfigs.appKey }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
