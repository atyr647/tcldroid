# NOTE: this workflow has never been run. It was written alongside the build
# scripts in a container that has no emulator; expect to fix details on first use.
name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: tcldroid-${{ hashFiles('upstream/versions.env') }}
      - name: Build Tcl + host APK (arm64-v8a, x86_64)
        run: tools/build-android-host.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-host/app/build/outputs/apk/debug/app-debug.apk

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run self-test on an x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: tests/android-smoke.sh apk/app-debug.apk
